name: PleatView Renderer
version: "1.0.17"
slug: pleatview_renderer
description: Renders PleatView dashboards here and streams them to slow TVs
url: https://github.com/Hustlesman/pleatview/blob/main/docs/render-on-home-assistant.md
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
# The GPU, where there is one, encodes the stream (Intel Quick Sync, AMD).
video: true
options:
  max_screens: 4
schema:
  max_screens: int(1,8)

name: PleatView Renderer
version: "1.1.3"
slug: pleatview_renderer
description: Renders PleatView dashboards here and streams them to slow TVs
url: https://github.com/Hustlesman/pleatview/blob/main/docs/render-on-home-assistant.md
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
# The GPU, where there is one, encodes the stream (Intel Quick Sync, AMD).
video: true
# The site's Home Assistant, shared with a controller elsewhere only when the options below say
# so (docs/renderer-connect-out.md#home-assistant-at-the-site): the app reaches it through the
# Supervisor, and its token never leaves the app.
homeassistant_api: true
options:
  max_screens: 4
  controller: ""
  controller_fingerprint: ""
  site_pages: []
  stream_url: ""
  share_home_assistant: false
  shared_entities:
    - camera.*
  share_screens: false
schema:
  max_screens: int(1,8)
  controller: str?
  controller_fingerprint: str?
  site_pages:
    - str
  stream_url: str?
  share_home_assistant: bool
  shared_entities:
    - str
  share_screens: bool
# Where the site's screens fetch their streams, when connecting out to a controller elsewhere
# (docs/renderer-connect-out.md). Nothing listens there otherwise.
ports:
  8781/tcp: 8781
ports_description:
  8781/tcp: Streams for this site's screens (only when connecting out to a controller)

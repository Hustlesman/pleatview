configuration:
  max_screens:
    name: Max screens
    description: How many TVs this app renders at once. Each one runs a browser here.
  controller:
    name: Controller elsewhere
    description: >-
      The address of a controller at another place to connect out to, such as
      controller.example.com. It then renders pages for this site's screens. Leave empty for
      Home Assistant only.
  controller_fingerprint:
    name: Controller's certificate
    description: >-
      The SHA-256 fingerprint of the controller's own certificate, only for a controller whose
      certificate this machine doesn't trust.
  site_pages:
    name: Pages on this network
    description: >-
      Places on this site's own network that the controller's pages may load, as host:port
      (homeassistant.local:8123) or an address with a prefix (192.168.1.40/32). Everything
      else on this network stays closed to them.
  stream_url:
    name: Streams address
    description: >-
      This machine's address on the site's network for the streams port, such as
      http://192.168.1.10:8781. Without it, the site's screens get their streams through the
      controller.
  share_home_assistant:
    name: Share this Home Assistant
    description: >-
      Lets the controller elsewhere use the entities listed below: their states, cameras'
      pictures and live streams, to-do lists and calendars. Home Assistant's token stays in this
      app. Off: the controller gets nothing from Home Assistant.
  shared_entities:
    name: Shared entities
    description: >-
      The entities the controller may use, by id, with * for any letters: camera.* for every
      camera, camera.front_door for one.
  find_screens:
    name: Find screens for the controller
    description: >-
      Lists this site's PleatView screens in the controller elsewhere, found by Home Assistant's
      PleatView integration, to be added there as on its own network: with OK pressed on the
      screen, or its PIN. Off: screens are added there with the code they show.
  share_screens:
    name: Move screens to the controller
    description: >-
      Lets the controller list this Home Assistant's PleatView screens and have the ones it
      chooses connect out to it, with nobody at them (they need PleatView 1.0.19 or later). Home
      Assistant keeps them too. Each move shows as a notification here.

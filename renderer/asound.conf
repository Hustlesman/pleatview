# The sound of each screen's Chromium (pleatview_renderer/sound.py): ALSA's file plugin writes
# it, as 48 kHz 16-bit stereo, into the screen's own pipe, which the renderer reads in real
# time. The null device under it plays nothing; there is no sound card.
pcm.pleatview {
    @args [ PIPE ]
    @args.PIPE { type string }
    type plug
    slave {
        pcm {
            type file
            slave.pcm "null"
            file $PIPE
            format "raw"
        }
        format S16_LE
        rate 48000
        channels 2
    }
}

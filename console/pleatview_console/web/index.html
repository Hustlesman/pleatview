<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e11">
  <meta name="color-scheme" content="dark">
  <title>PleatView Console</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar" hidden id="bar">
    <a class="brand" href="#/screens"><img src="/icon.svg" alt="" width="28" height="28"><span>PleatView Console</span></a>
    <select id="tenant" aria-label="Organisation" hidden></select>
    <nav id="tabs" aria-label="Sections">
      <a href="#/screens" data-tab="screens">Screens</a>
      <a href="#/groups" data-tab="groups">Groups</a>
      <a href="#/content" data-tab="content">Content</a>
      <a href="#/sites" data-tab="sites">Sites</a>
      <a href="#/members" data-tab="members" id="members-tab" hidden>Members</a>
      <a href="#/activity" data-tab="activity">Activity</a>
    </nav>
    <span class="spacer"></span>
    <button type="button" id="install" class="quiet" hidden>Install app</button>
    <details class="menu" id="usermenu">
      <summary id="username"></summary>
      <div class="menu-items">
        <button type="button" id="add-tenant" hidden>Add an organisation</button>
        <button type="button" id="console-settings" hidden>Console settings</button>
        <button type="button" id="change-password">Change password</button>
        <button type="button" id="two-factor">Two-factor sign-in</button>
        <button type="button" id="logout">Sign out</button>
      </div>
    </details>
  </header>

  <main id="main" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <p class="error" id="dialog-error" role="alert"></p>
      <div class="actions">
        <button type="button" class="quiet" id="dialog-cancel">Cancel</button>
        <button type="submit" id="dialog-ok">OK</button>
      </div>
    </form>
  </dialog>

  <noscript>PleatView Console needs JavaScript.</noscript>
</body>
</html>

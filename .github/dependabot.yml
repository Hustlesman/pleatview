# Updates are proposed as pull requests, reviewed like any other change before they're merged.
# Monthly and grouped per ecosystem, and only for versions out for a week (a bad release is
# usually pulled by then).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # From v6 its caching is a proprietary component under Gradle's terms of use; v5 is
      # all MIT. PleatView's build tools stay open source.
      - dependency-name: gradle/actions/setup-gradle
        versions: [">= 6"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      android:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /linux
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      linux:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python-tests:
        patterns: ["*"]

  # The image people run: the renderer.
  - package-ecosystem: docker
    directory: /renderer
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

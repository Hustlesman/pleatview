name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pleatview-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Packages for x86-64 and ARM64
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: pleatview-linux-debs
          path: linux/dist/*.deb

  integration:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -p no:cacheprovider -q

  renderer:
    name: Renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t pleatview-renderer renderer
      - name: Tests, inside the image
        run: >-
          docker run --rm --entrypoint python3 -v "$PWD:/repo:ro" -w /repo/renderer pleatview-renderer
          -m unittest discover -v tests
      - name: Installed packages, for audits
        run: docker run --rm --entrypoint cat pleatview-renderer /app-packages.txt | tee renderer-packages.txt
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-packages
          path: renderer-packages.txt

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t pleatview-console console
      - name: Tests, inside the image
        run: >-
          docker run --rm --entrypoint python3 -v "$PWD:/repo:ro" -w /repo/console pleatview-console
          -m unittest discover -v tests
      - name: Installed packages, for audits
        run: docker run --rm --entrypoint cat pleatview-console /app-packages.txt | tee console-packages.txt
      - uses: actions/upload-artifact@v4
        with:
          name: console-packages
          path: console-packages.txt

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

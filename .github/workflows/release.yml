name: Release

# Push a tag such as v0.2.0 (matching versionName and the integration's manifest version).
on:
  push:
    tags: ["v*"]

# Actions are pinned to commits: this workflow holds the signing key and can publish releases.
permissions:
  contents: write
  # Build attestations: anyone can check that a release file was built here.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  # The Linux packages build in a job of their own, with no signing key and no right to publish:
  # npm packages run scripts when they install.
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the version matches the tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match linux/package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Packages for x86-64 and ARM64
        run: npm run dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages
          path: linux/dist/*.deb
          if-no-files-found: error

  release:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check versions match the tag
        run: |
          app=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)
          integration=$(python3 -c "import json; print(json.load(open('custom_components/pleatview/manifest.json'))['version'])")
          for version in "$app" "$integration"; do
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $app / manifest version $integration"
              exit 1
            fi
          done

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The same key must sign every release, or installed apps can't update.
      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLEATVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing PLEATVIEW_KEYSTORE_BASE64 secret; refusing to publish an APK signed with a throwaway key"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PLEATVIEW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and app bundle
        working-directory: android
        env:
          PLEATVIEW_KEYSTORE_PASSWORD: ${{ secrets.PLEATVIEW_KEYSTORE_PASSWORD }}
          PLEATVIEW_KEY_ALIAS: ${{ secrets.PLEATVIEW_KEY_ALIAS }}
          PLEATVIEW_KEY_PASSWORD: ${{ secrets.PLEATVIEW_KEY_PASSWORD }}
        # The bundle goes to Google Play; the APK is the GitHub download.
        run: |
          ./gradlew --no-daemon bundleRelease
          ./gradlew --no-daemon assembleRelease

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Keep the app bundle for Google Play
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pleatview-${{ github.ref_name }}-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-packages
          path: linux-packages

      - name: Package the release files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pleatview.apk
          (cd custom_components && zip -qr ../pleatview-integration.zip pleatview -x "*/__pycache__/*")
          cp linux-packages/pleatview_*_amd64.deb pleatview_amd64.deb
          cp linux-packages/pleatview_*_arm64.deb pleatview_arm64.deb
          sha256sum pleatview.apk pleatview-integration.zip pleatview_amd64.deb pleatview_arm64.deb > SHA256SUMS

      # Signed build provenance, so anyone can check where a file came from:
      #   gh attestation verify pleatview.apk --repo Hustlesman/pleatview
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            pleatview.apk
            pleatview-integration.zip
            pleatview_amd64.deb
            pleatview_arm64.deb
            android/app/build/outputs/bundle/release/*.aab

      # Fixed asset names keep https://github.com/Hustlesman/pleatview/releases/latest/download/pleatview.apk
      # (and pleatview.hustlesman.com/apk) pointing at the newest release, and the same for
      # pleatview_amd64.deb and pleatview_arm64.deb (named for `dpkg --print-architecture`).
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "latest" skips pre-releases, so only tags like v1.2.0-rc.1 are marked as one.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" pleatview.apk pleatview-integration.zip \
            pleatview_amd64.deb pleatview_arm64.deb SHA256SUMS \
            --title "PleatView $GITHUB_REF_NAME" --generate-notes $prerelease

name: Website

on:
  push:
    branches: [main]
    paths: [site/**, tools/site-release.py, .github/workflows/pages.yml]
  # The site shows the latest release's version and date (tools/site-release.py). The
  # release workflow asks for a deploy on main (only main may deploy the site), and a
  # daily one catches anything missed.
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

# Actions are pinned to commits: this workflow publishes the website.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The latest release's version and date
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/site-release.py site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
